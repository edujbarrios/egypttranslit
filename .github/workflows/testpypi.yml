name: Publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install pinned release tools
        run: python -m pip install build==1.6.1 twine==7.0.0
      - name: Install package for release validation
        run: python -m pip install -e .
      - name: Validate synchronized release metadata
        run: python scripts/check_release.py
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate PyPI metadata
        run: python -m twine check dist/*
      - name: Audit artifact contents
        run: python scripts/check_artifacts.py
      - name: Upload release distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testpypi-dists
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/egypttranslit
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: testpypi-dists
          path: dist/
      - name: Publish release distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
