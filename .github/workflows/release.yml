name: Release to PyPI

on:
  push:
    tags:
      - "v*"
    branches:
      - "release-trigger/v1.1.1"
  workflow_dispatch:
    inputs:
      version:
        description: "Version already prepared on main (for example 0.9.0)"
        required: true
        type: string

concurrency:
  group: pypi-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install pinned release tools
        run: python -m pip install build==1.6.1 twine==7.0.0
      - name: Install package for release validation
        run: python -m pip install -e .
      - name: Validate synchronized release metadata
        run: python scripts/check_release.py
      - name: Resolve and validate release version
        id: release-version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
            test "$REQUESTED_VERSION" = "$VERSION"
          elif [ "$GITHUB_REF" = "refs/heads/release-trigger/v1.1.1" ]; then
            test "$VERSION" = "1.1.1"
          else
            test "$GITHUB_REF_NAME" = "v${VERSION}"
          fi
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate PyPI metadata
        run: python -m twine check dist/*
      - name: Audit artifact contents
        run: python scripts/check_artifacts.py
      - name: Upload release distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/egypttranslit
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@634f93cb2916e75b540449e92b4886f43607fa02 # v5
        with:
          name: release-dists
          path: dist/
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Create GitHub release and tag
        shell: bash
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release ${TAG} already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "egypttranslit ${VERSION}" \
            --generate-notes
