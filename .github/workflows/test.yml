name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install editable package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Check installed dependencies
        run: python -m pip check
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify metadata files in wheel
        run: |
          WHEEL="$(ls dist/*.whl)"
          python -m zipfile -l "$WHEEL" | grep -E 'LICENSE|NOTICE|egypttranslit/py\.typed'
      - name: Verify isolated wheel installation
        run: |
          python -m venv /tmp/egypttranslit-wheel
          /tmp/egypttranslit-wheel/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/egypttranslit-wheel/bin/python - <<'PY'
          from importlib.resources import files
          from egypttranslit import __version__, normalize_unicode, parse, parse_mdc

          assert __version__ == "0.6.0"
          assert parse("nTr Htp") == "nṯr ḥtp"
          assert parse_mdc("ra nfr") == "r\uA725 nfr"
          assert normalize_unicode("\u021D \u02BF") == "\uA723 \uA725"
          assert files("egypttranslit").joinpath("py.typed").is_file()
          PY
