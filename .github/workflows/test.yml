name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install editable package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Check installed dependencies
        run: python -m pip check

  cross-platform:
    name: ${{ matrix.os }} / Python 3.14
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install editable package
        run: python -m pip install -e .
      - name: Run full test suite
        run: python -m unittest discover -s tests
      - name: Check installed dependencies
        run: python -m pip check

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install package and quality tools
        run: python -m pip install -e . mypy ruff
      - name: Compile Python sources
        run: python -m compileall -q egypttranslit tests scripts
      - name: Lint
        run: python -m ruff check egypttranslit tests scripts
      - name: Check formatting
        run: python -m ruff format --check egypttranslit tests scripts
      - name: Type check public package
        run: python -m mypy --strict egypttranslit
      - name: Validate release metadata
        run: python scripts/check_release.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Install package for release checks
        run: python -m pip install -e .
      - name: Validate release metadata
        run: python scripts/check_release.py
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate PyPI metadata
        run: python -m twine check dist/*
      - name: Verify reproducible wheel build
        env:
          SOURCE_DATE_EPOCH: "1700000000"
        run: |
          rm -rf /tmp/egypttranslit-wheel-a /tmp/egypttranslit-wheel-b
          python -m build --wheel --outdir /tmp/egypttranslit-wheel-a
          python -m build --wheel --outdir /tmp/egypttranslit-wheel-b
          WHEEL_A="$(find /tmp/egypttranslit-wheel-a -maxdepth 1 -name '*.whl' -print -quit)"
          WHEEL_B="$(find /tmp/egypttranslit-wheel-b -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$WHEEL_A" && test -n "$WHEEL_B"
          cmp "$WHEEL_A" "$WHEEL_B"
          sha256sum "$WHEEL_A" "$WHEEL_B"
      - name: Audit artifact contents
        run: python scripts/check_artifacts.py
      - name: Verify isolated wheel installation
        run: |
          WHEEL="$(ls "$GITHUB_WORKSPACE"/dist/*.whl)"
          python -m venv /tmp/egypttranslit-wheel
          /tmp/egypttranslit-wheel/bin/python -m pip install --no-deps "$WHEEL"
          cd /tmp
          /tmp/egypttranslit-wheel/bin/python - <<'PY'
          from importlib.metadata import version
          from importlib.resources import files
          from egypttranslit import __version__, normalize_unicode, parse, parse_mdc

          assert __version__ == version("egypttranslit")
          assert parse("nTr mAat") == "nṯr mꜣꜥt"
          assert parse("A taxi on the X axis.") == "A taxi on the X axis."
          assert parse("mATH") == "mATH"
          assert parse_mdc("mATH") == "mꜣṯḥ"
          assert parse_mdc("A1-nTr-D36-Htp-T3") == "A1-nṯr-D36-ḥtp-T3"
          assert parse_mdc("nTr Htp") == "nṯr ḥtp"
          assert normalize_unicode("\u021D \u02BF") == "\uA723 \uA725"
          assert files("egypttranslit").joinpath("py.typed").is_file()
          PY
      - name: Verify isolated source distribution installation
        run: |
          SDIST="$(ls "$GITHUB_WORKSPACE"/dist/*.tar.gz)"
          python -m venv /tmp/egypttranslit-sdist
          /tmp/egypttranslit-sdist/bin/python -m pip install --no-deps "$SDIST"
          cd /tmp
          /tmp/egypttranslit-sdist/bin/python - <<'PY'
          from importlib.metadata import version
          from egypttranslit import __version__, parse, parse_mdc

          assert __version__ == version("egypttranslit")
          assert parse("mATH") == "mATH"
          assert parse_mdc("A1-nTr-D36-Htp-T3") == "A1-nṯr-D36-ḥtp-T3"
          PY

  python-next:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Install editable package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests
