name: Property checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hypothesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - name: Install package and Hypothesis
        run: python -m pip install -e . hypothesis==6.168.3
      - name: Run property checks
        run: python scripts/property_checks.py
